server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"frontend"}';
    }

    location = /actuator/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"frontend"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
